apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
        - name: auth-service
          image: subodh009/auth-service:1.0
          imagePullPolicy: Always

          ports:
            - containerPort: 8081

          env:
            - name: AUTH_DB_URL
              value: "jdbc:postgresql://postgres-service:5432/auth_db"

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgre-secret
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgre-secret
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
