apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory
          image: subodh009/inventory-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: INVENTORY_DB_URL
              value: "postgres://microapp:microapp123@postgres-service:5432/inventory_db?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8083
      targetPort: 8083
