apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order
          image: subodh009/order-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: ORDER_DB_DSN
              value: "dbname=order_db user=microapp password=microapp123 host=postgres-service port=5432"
            - name: CATALOG_URL
              value: "http://catalog-service:8082"
            - name: INVENTORY_URL
              value: "http://inventory-service:8083"
            - name: NOTIFICATION_URL
              value: "http://notification-service:8086"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8084
      targetPort: 8084
