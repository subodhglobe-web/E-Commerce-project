apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment
          image: subodh009/payment-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: PAYMENT_DB_URL
              value: "Host=postgres-service;Port=5432;Database=payment_db;Username=microapp;Password=microapp123"
            - name: ORDER_URL
              value: "http://order-service:8084"
            - name: INVENTORY_URL
              value: "http://inventory-service:8083"
            - name: NOTIFICATION_URL
              value: "http://notification-service:8086"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
