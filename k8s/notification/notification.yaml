apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification
          image: subodh009/notification-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8086
          env:
            - name: NOTIFICATION_DB_URL
              value: "postgres://microapp:microapp123@postgres-service:5432/notification_db?sslmode=disable"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8086
      targetPort: 8086
