
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      containers:
        - name: catalog
          image: subodh009/catalog-service:1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
          env:
            - name: CATALOG_DB_DSN
              value: "postgres://microapp:microapp123@postgres-service:5432/catalog_db?sslmode=disable"

